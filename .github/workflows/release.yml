name: Release (draft)

# Pushing a version tag such as v0.12.0 builds the release packages from that commit and creates a DRAFT GitHub
# release with them. Nothing is published: a person tests the draft on real hardware, then publishes it.
# The tag must match package.json and the Fadester for OBS manifest. The Companion version comes from
# installer/components.json (companion.version), so the suite setup, the ZIP and the Store package agree.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  streamdeck:
    name: Fadester for OBS package and VJster extension
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Tag must match the plugin version
        run: |
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./io.github.jbrick2070.fadester-for-obs.sdPlugin/manifest.json').Version")
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json $pkg"; exit 1; }
          [ "$man" = "$pkg.0" ] || { echo "manifest.json Version $man does not match package.json $pkg"; exit 1; }
      - run: npm ci
      - name: Build, validate and pack
        run: node --import tsx scripts/suite/package-candidate.ts
      - name: Full test suite against the built tree
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-streamdeck
          path: |
            release/candidates/windows-macos/*.streamDeckPlugin
            release/candidates/windows-macos/*.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  companion:
    name: Fadester Companion ZIP and Store package
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - name: Build Fadester Companion (self-tests run inside build.ps1)
        shell: pwsh
        run: |
          npm ci
          npm run build:vjster-page
          $v = (Get-Content -Raw installer\components.json | ConvertFrom-Json).components.companion.version
          $out = Join-Path $env:RUNNER_TEMP 'companion'
          & .\tourbox\build.ps1 -OutDir $out -Version $v
          $build = (Get-ChildItem -LiteralPath $out -Directory -Filter 'build-*' | Select-Object -First 1).FullName + '\Fadester Companion'
          & .\tourbox\store\make-msix.ps1 -Build $build -OutDir $out -Version "$v.0" -Overwrite
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -Path (Join-Path $out 'Fadester-Companion-Windows-x64-*.zip') -Destination artifacts
          Copy-Item -Path (Join-Path $out 'FadesterCompanion_*.msix') -Destination artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-companion
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Create the draft release
    needs: [streamdeck, companion]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          {
            echo "Draft built from \`$GITHUB_SHA\`. Test on real hardware before publishing."
            echo
            echo "### Checksums (SHA-256)"
            for f in *; do echo "    $f: $(sha256sum "$f" | cut -d ' ' -f 1)"; done
          } > ../CHECKSUMS.md
          cat ../CHECKSUMS.md
      - uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Fadester for OBS ${{ github.ref_name }}
          body_path: CHECKSUMS.md
          files: dist/*
