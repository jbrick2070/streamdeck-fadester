<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fadester for OBS — OBS Fade</title>
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <h3><span data-i18n="fadeHeading">OBS fade</span> <span class="scope" data-i18n="scopeThisKey">this key</span></h3>
  <p class="muted" data-i18n="fadeIntro">Starts with Main audio from your current OBS mixer. Choose a fixed input to keep this button assigned to it.</p>
  <div id="direct-fade-status" class="status-banner status-info" style="display:none;"></div>
  <div class="row">
    <label for="obs-fade-target" data-i18n="control">Control</label>
    <select id="obs-fade-target">
      <option value="input_volume" data-i18n="mixerInput">Mixer input</option>
      <option value="all_inputs" data-i18n="mixAll">All OBS mixer inputs</option>
    </select>
  </div>
  <div class="row" id="obs-fade-input-row">
    <label for="obs-fade-input" data-i18n="mixerInput">Mixer input</label>
    <select id="obs-fade-input"></select>
    <button id="obs-fade-refresh" class="btn secondary" type="button" data-i18n="refresh">Refresh</button>
  </div>
  <div class="row">
    <label for="obs-fade-to" data-i18n="fadeTo">Fade to</label>
    <select id="obs-fade-to"><option id="obs-fade-up" value="1" data-i18n="percent100">100 %</option><option id="obs-fade-down" value="0" data-i18n="percent0">0 %</option></select>
  </div>
  <div class="row" id="obs-fade-duration-row">
    <label for="obs-fade-duration" data-i18n="durationMs">Duration (ms)</label>
    <input id="obs-fade-duration" type="number" min="0" max="20000" step="50" value="1000" />
  </div>
  <p id="obs-fade-duration-note" class="muted" data-i18n="fadeInstantNote">0 ms is instant. Any new volume move cancels a running fade for that input.</p>
  <div class="row">
    <label for="obs-fade-label" data-i18n="label">Label</label>
    <input id="obs-fade-label" type="text" maxlength="14" placeholder="From OBS (leave blank)" data-i18n-placeholder="placeholderFromObs" />
  </div>
  <div id="direct-shared-sections"></div>
  <script src="i18n.js"></script>
  <script src="preset-captions.js"></script>
  <script src="direct-pi.js"></script>
  <script>
    window.initDirectObsPropertyInspector(function (settings, save, state) {
      const T = window.FadesterI18n.t;
      const target = document.getElementById("obs-fade-target");
      const all = settings.target === "all_inputs";
      const input = document.getElementById("obs-fade-input");
      const to = document.getElementById("obs-fade-to");
      const duration = document.getElementById("obs-fade-duration");
      const label = document.getElementById("obs-fade-label");
      const banner = document.getElementById("direct-fade-status");
      const catalog = state && state.catalog ? state.catalog : {};
      const selectedInput = settings.inputName === undefined ? "__audio_main__" : settings.inputName;
      // A bundled profile's caption is a default: shown empty here, released on retarget.
      const generatedLabel = function () {
        return window.FadesterPresetCaptions.isGenerated("fade", { inputName: selectedInput, labelOverride: settings.labelOverride });
      };
      window.directObsFillSelect(input, window.directObsAudioItems(state), selectedInput, T("fadeChooseInput"));
      if (target && document.activeElement !== target) target.value = all ? "all_inputs" : "input_volume";
      ["obs-fade-input-row", "obs-fade-duration-row", "obs-fade-duration-note"].forEach(function (id) {
        const row = document.getElementById(id);
        if (row) row.style.display = all ? "none" : "";
      });
      const up = document.getElementById("obs-fade-up"), down = document.getElementById("obs-fade-down");
      if (up) up.textContent = T(all ? "mixRestore" : "percent100");
      if (down) down.textContent = T(all ? "mixFadeOut" : "percent0");
      if (to && document.activeElement !== to) to.value = String(settings.to === 0 ? 0 : 1);
      if (duration && document.activeElement !== duration) duration.value = String(settings.durationMs !== undefined ? settings.durationMs : 1000);
      if (label && document.activeElement !== label) label.value = generatedLabel() ? "" : settings.labelOverride || "";
      if (banner) {
        const automatic = state && state.automaticInputs && Object.prototype.hasOwnProperty.call(state.automaticInputs, selectedInput);
        const missing = automatic ? !state.automaticInputs[selectedInput] : selectedInput && !Object.prototype.hasOwnProperty.call(catalog.inputVolumes || {}, selectedInput);
        const show = all || !selectedInput || missing;
        banner.textContent = all ? window.directObsMixHint(state) : T(missing ? "fadeInputUnavailable" : "fadeChooseToFade");
        banner.className = "status-banner status-info";
        banner.style.display = show ? "block" : "none";
      }
      if (target) target.onchange = function () {
        const update = { target: target.value };
        if (generatedLabel()) update.labelOverride = "";
        save(update);
      };
      if (input) input.onchange = function () {
        const update = { inputName: input.value };
        if (input.value !== selectedInput && generatedLabel()) update.labelOverride = "";
        save(update);
      };
      if (to) to.onchange = function () { save({ to: Number(to.value) === 0 ? 0 : 1 }); };
      if (duration) duration.onchange = function () { save({ durationMs: Number(duration.value) }); };
      if (label) label.onchange = function () { save({ labelOverride: label.value.trim() }); };
      const refresh = document.getElementById("obs-fade-refresh");
      if (refresh) refresh.onclick = function () { window.directObsRefresh(); };
    });
  </script>
</body>
</html>
