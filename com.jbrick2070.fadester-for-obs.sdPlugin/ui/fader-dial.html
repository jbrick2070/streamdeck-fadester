<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fadester for OBS — Fader Dial</title>
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <h3><span data-i18n="mfFaderHeading">Midi Fadester fader</span> <span class="scope" data-i18n="scopeOptional">optional integration</span></h3>
  <p class="muted" data-i18n="mfFaderIntro">This is the advanced shared-slot integration. For normal OBS mixer and Scene T-bar control, choose <strong data-slot="action" data-i18n="actionObsFader">OBS Fader</strong> instead.</p>
  <div id="slot-reason-banner" class="status-banner status-err" style="display:none;"></div>

  <div class="row">
    <label for="slot-select" data-i18n="slot">Slot</label>
    <select id="slot-select"></select>
  </div>

  <div class="row">
    <label for="label-input" data-i18n="label">Label</label>
    <input type="text" id="label-input" maxlength="14" placeholder="From OBS (leave blank)" data-i18n-placeholder="placeholderFromObs" />
  </div>

  <div class="row">
    <label for="readout-select" data-i18n="readout">Readout</label>
    <select id="readout-select">
      <option value="auto" selected data-i18n="readoutAuto">Engine value (px, dB, %)</option>
      <option value="percent" data-i18n="readoutPercent">Always percent</option>
    </select>
  </div>

  <div class="row">
    <label for="step-select" data-i18n="stepPerTick">Step per tick</label>
    <select id="step-select">
      <option value="0.005" data-i18n="stepFine">0.5 % (fine)</option>
      <option value="0.01" data-i18n="step1">1 %</option>
      <option value="0.02" selected data-i18n="stepDefault">2 % (default)</option>
      <option value="0.05" data-i18n="step5">5 %</option>
      <option value="0.1" data-i18n="stepCoarse">10 % (coarse)</option>
    </select>
  </div>

  <div class="row">
    <label for="accel-check" data-i18n="acceleration">Acceleration</label>
    <input type="checkbox" id="accel-check" checked />
    <span class="hint" data-i18n="accelerationHint">Fast turns take bigger steps</span>
  </div>

  <div class="row">
    <label for="press-select" data-i18n="dialPress">Dial press</label>
    <select id="press-select">
      <option value="snap_0_100" selected data-i18n="pressSnap">Snap to 0 / 100 %</option>
      <option value="clean_0" data-i18n="pressClean">Clean (0 %)</option>
      <option value="auto_fade_1s" data-i18n="pressAutoFade1">Auto-fade 1 s</option>
      <option value="auto_fade_2s" data-i18n="pressAutoFade2">Auto-fade 2 s</option>
      <option value="cut" data-i18n="pressCut">Cut</option>
      <option value="finish_tbar" data-i18n="pressFinishTbar">Finish T-bar</option>
    </select>
  </div>

  <div class="row">
    <label for="long-press-select" data-i18n="hold">Hold (0.8 s)</label>
    <select id="long-press-select">
      <option value="auto_fade_3s" selected data-i18n="holdAutoFade3">Auto-fade 3 s (with Hold indicator)</option>
      <option value="clean_all_fx" data-i18n="cleanAllFx">Clean All FX</option>
      <option value="finish_tbar" data-i18n="pressFinishTbar">Finish T-bar</option>
      <option value="none" data-i18n="holdNone">None</option>
    </select>
  </div>

  <div class="row">
    <label for="thumb-check" data-i18n="thumbnails">Live thumbnails</label>
    <input type="checkbox" id="thumb-check" checked />
    <span class="hint" data-i18n="thumbnailsHint">96×54 in Mix two layers cells (1–2 FPS)</span>
  </div>

  <div id="shared-sections"></div>

  <script src="i18n.js"></script>
  <script src="pi-common.js"></script>
  <script>
    window.onFadesterState = function (state) {
      const longPressEl = document.getElementById("long-press-select");
      if (!longPressEl) return;
      const opt = longPressEl.querySelector('option[value="clean_all_fx"]');
      if (!opt) return;
      const connected = state.status && state.status.kind === "connected";
      const supported = state.capabilities && state.capabilities.resetFx;
      opt.textContent = window.FadesterI18n.t(connected && !supported ? "cleanAllFxNeeds" : "cleanAllFx");
    };

    window.initFadesterPropertyInspector(function (settings, save) {
      const slotEl = document.getElementById("slot-select");
      const labelEl = document.getElementById("label-input");
      const readoutEl = document.getElementById("readout-select");
      const stepEl = document.getElementById("step-select");
      const accelEl = document.getElementById("accel-check");
      const pressEl = document.getElementById("press-select");
      const longPressEl = document.getElementById("long-press-select");
      const thumbEl = document.getElementById("thumb-check");

      if (slotEl && settings.slot) slotEl.value = settings.slot;
      if (labelEl) labelEl.value = settings.labelOverride || "";
      if (readoutEl) readoutEl.value = settings.readoutStyle === "percent" ? "percent" : "auto";
      if (stepEl) stepEl.value = String(settings.stepPerTick || 0.02);
      if (accelEl) accelEl.checked = settings.acceleration !== false;
      if (pressEl) pressEl.value = settings.pressAction || "snap_0_100";
      if (longPressEl) longPressEl.value = settings.longPressAction || "auto_fade_3s";
      if (thumbEl) thumbEl.checked = settings.showThumbnails !== false;

      if (slotEl) slotEl.onchange = () => save({ slot: slotEl.value });
      if (labelEl) labelEl.onchange = () => save({ labelOverride: labelEl.value.trim() });
      if (readoutEl) readoutEl.onchange = () => save({ readoutStyle: readoutEl.value });
      if (stepEl) stepEl.onchange = () => save({ stepPerTick: Number(stepEl.value) });
      if (accelEl) accelEl.onchange = () => save({ acceleration: accelEl.checked });
      if (pressEl) pressEl.onchange = () => save({ pressAction: pressEl.value });
      if (longPressEl) longPressEl.onchange = () => save({ longPressAction: longPressEl.value });
      if (thumbEl) thumbEl.onchange = () => save({ showThumbnails: thumbEl.checked });
    });
  </script>
</body>
</html>
