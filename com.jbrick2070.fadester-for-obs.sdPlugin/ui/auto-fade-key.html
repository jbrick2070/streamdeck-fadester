<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fadester for OBS — Auto-fade Key</title>
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <h3>Auto-fade key <span class="scope">this action</span></h3>
  <div id="slot-reason-banner" class="status-banner status-err" style="display:none;"></div>

  <div class="row">
    <label for="slot-select">Slot</label>
    <select id="slot-select" data-allow-all-fx="true"></select>
  </div>

  <div class="row" id="to-row">
    <label for="to-select">Fade to</label>
    <select id="to-select">
      <option value="1" selected>100 %</option>
      <option value="0">0 %</option>
    </select>
  </div>

  <div class="row">
    <label for="duration-input">Duration (ms)</label>
    <input type="number" id="duration-input" value="1000" min="0" max="20000" step="50" />
  </div>
  <p class="muted" id="duration-hint">0 ms = instant. A T-bar return to 0 % cancels the throw. 50–20000 ms = timed fade following the slot's curve.</p>

  <div class="row">
    <label for="label-input">Label</label>
    <input type="text" id="label-input" maxlength="14" placeholder="From OBS (leave blank)" />
  </div>

  <div class="row" id="readout-row">
    <label for="readout-select">Readout</label>
    <select id="readout-select">
      <option value="auto" selected>Engine value (px, dB, %)</option>
      <option value="percent">Always percent</option>
    </select>
  </div>

  <div id="shared-sections"></div>

  <script src="pi-common.js"></script>
  <script>
    function syncAllFxVisibility(settings) {
      const isAllFx = settings.slot === "__all_fx__";
      const toRow = document.getElementById("to-row");
      const hint = document.getElementById("duration-hint");
      const readoutRow = document.getElementById("readout-row");
      if (toRow) toRow.style.display = isAllFx ? "none" : "";
      if (readoutRow) readoutRow.style.display = isAllFx ? "none" : "";
      if (hint) {
        hint.textContent = isAllFx
          ? "All FX: resets enabled filter bindings in either bank to 0 %. Audio and layer controls stay unchanged. 0 ms = instant; 50–20000 ms = timed ramp."
          : "0 ms = instant. A T-bar return to 0 % cancels the throw. 50–20000 ms = timed fade following the slot's curve.";
      }
    }

    window.onFadesterState = function (state, settings) {
      syncAllFxVisibility(settings || {});
    };

    window.initFadesterPropertyInspector(function (settings, save) {
      const slotEl = document.getElementById("slot-select");
      const toEl = document.getElementById("to-select");
      const durEl = document.getElementById("duration-input");
      const labelEl = document.getElementById("label-input");
      const readoutEl = document.getElementById("readout-select");

      if (slotEl && settings.slot) slotEl.value = settings.slot;
      if (toEl) toEl.value = String(settings.to !== undefined ? settings.to : 1);
      if (durEl) durEl.value = String(settings.durationMs !== undefined ? settings.durationMs : 1000);
      if (labelEl) labelEl.value = settings.labelOverride || "";
      if (readoutEl) readoutEl.value = settings.readoutStyle === "percent" ? "percent" : "auto";
      syncAllFxVisibility(settings);

      if (slotEl) slotEl.onchange = () => { save({ slot: slotEl.value }); syncAllFxVisibility({ slot: slotEl.value }); };
      if (toEl) toEl.onchange = () => save({ to: Number(toEl.value) === 0 ? 0 : 1 });
      if (durEl) durEl.onchange = () => save({ durationMs: Number(durEl.value) });
      if (labelEl) labelEl.onchange = () => save({ labelOverride: labelEl.value.trim() });
      if (readoutEl) readoutEl.onchange = () => save({ readoutStyle: readoutEl.value });
    });
  </script>
</body>
</html>
