<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fadester for OBS — Auto-fade Key</title>
  <style>
    body {
      background: #111827;
      color: #F8FAFC;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 10px 12px;
    }
    h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #93C5FD;
      margin: 12px 0 6px 0;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
    }
    .row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .row label {
      width: 105px;
      flex-shrink: 0;
      color: #CBD5E1;
    }
    .row select, .row input[type="text"], .row input[type="number"], .row input[type="password"] {
      flex: 1;
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
    }
    .status-banner {
      padding: 6px 8px;
      border-radius: 4px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .status-ok {
      background: #064E3B;
      border: 1px solid #22C55E;
      color: #D1FAE5;
    }
    .status-err {
      background: #451A03;
      border: 1px solid #F97316;
      color: #FFEDD5;
    }
    .btn {
      background: #2563EB;
      color: #F8FAFC;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background: #1D4ED8;
    }
    a.release-link {
      color: #F97316;
      font-weight: 700;
      text-decoration: underline;
      display: none;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h3>Auto-fade Key Control</h3>
  <div id="slot-reason-banner" class="status-banner status-err" style="display:none;"></div>

  <div class="row">
    <label for="slot-select">Slot</label>
    <select id="slot-select"></select>
  </div>

  <div class="row">
    <label for="to-select">Fade To</label>
    <select id="to-select">
      <option value="1" selected>100 %</option>
      <option value="0">0 %</option>
    </select>
  </div>

  <div class="row">
    <label for="duration-input">Duration (ms)</label>
    <input type="number" id="duration-input" value="1000" min="50" max="20000" step="50" />
  </div>

  <h3>OBS WebSocket Connection (Global)</h3>
  <div id="conn-status" class="status-banner status-err">
    OBS is not running or the websocket is off (Tools &gt; WebSocket Server Settings)
  </div>
  <a id="conn-link" class="release-link" href="https://github.com/jbrick2070/midi-fadester/releases" target="_blank">
    Download Midi Fadester for OBS Studio 33
  </a>

  <div class="row">
    <label for="conn-host">Host</label>
    <input type="text" id="conn-host" value="127.0.0.1" />
  </div>
  <div class="row">
    <label for="conn-port">Port</label>
    <input type="number" id="conn-port" value="4455" min="1" max="65535" />
  </div>
  <div class="row">
    <label for="conn-password">Password</label>
    <input type="password" id="conn-password" placeholder="Leave blank if authentication is off" />
  </div>
  <div class="row">
    <label></label>
    <button id="conn-test-btn" class="btn" type="button">Connect / Test</button>
  </div>

  <script src="pi-common.js"></script>
  <script>
    window.initFadesterPropertyInspector(function (settings, save) {
      const slotEl = document.getElementById("slot-select");
      const toEl = document.getElementById("to-select");
      const durEl = document.getElementById("duration-input");

      if (slotEl && settings.slot) slotEl.value = settings.slot;
      if (toEl) toEl.value = String(settings.to !== undefined ? settings.to : 1);
      if (durEl) durEl.value = String(settings.durationMs || 1000);

      if (slotEl) slotEl.onchange = () => save({ slot: slotEl.value });
      if (toEl) toEl.onchange = () => save({ to: Number(toEl.value) === 0 ? 0 : 1 });
      if (durEl) durEl.onchange = () => save({ durationMs: Number(durEl.value) });
    });
  </script>
</body>
</html>
