name: TourBox macOS core checks

on:
  push:
    branches: [main, codex/tourbox-macos-ci]
    paths:
      - .github/workflows/tourbox-macos.yml
      - tourbox/bridge/**
      - tourbox/tests/portable/**
      - tourbox/tests/StudioFaderSelfTests.cs
      - tourbox/presets/**
      - tourbox/MACOS.md
      - LICENSE
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tourbox-macos.yml
      - tourbox/bridge/**
      - tourbox/tests/portable/**
      - tourbox/tests/StudioFaderSelfTests.cs
      - tourbox/presets/**
      - tourbox/MACOS.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourbox-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks (${{ matrix.rid }})
    # Standard public-repository runners. No paid larger runners or signing secrets.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
            machine: arm64
          - runner: macos-15-intel
            rid: osx-x64
            machine: x86_64
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Confirm native Mac architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          sw_vers
          dotnet --info
      - name: Validate the master preset format
        run: python tourbox/presets/build.py --check
      - name: Run shared production core checks
        run: dotnet run --project tourbox/tests/portable/FadesterCoreChecks.csproj --configuration Release -- --map tourbox/presets/map.json
      - name: Build and verify the native developer executable
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: |
          bundle="$RUNNER_TEMP/FadesterCoreChecks-$TARGET_RID"
          dotnet publish tourbox/tests/portable/FadesterCoreChecks.csproj \
            --configuration Release --runtime "$TARGET_RID" --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=None --output "$bundle"
          # Running from outside the checkout verifies packaged map discovery.
          (cd "$RUNNER_TEMP" && "$bundle/FadesterCoreChecks")
          cp tourbox/MACOS.md "$bundle/README.md"
          cp LICENSE "$bundle/LICENSE"
          mkdir -p "$bundle/runtime-notices"
          cp "$DOTNET_ROOT/LICENSE.txt" "$bundle/runtime-notices/"
          cp "$DOTNET_ROOT/ThirdPartyNotices.txt" "$bundle/runtime-notices/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/SOURCE-COMMIT.txt"
          mkdir -p artifacts
          tar -czf "artifacts/FadesterCoreChecks-$TARGET_RID.tar.gz" -C "$RUNNER_TEMP" "FadesterCoreChecks-$TARGET_RID"
          (cd artifacts && shasum -a 256 "FadesterCoreChecks-$TARGET_RID.tar.gz" > "FadesterCoreChecks-$TARGET_RID.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FadesterCoreChecks-${{ matrix.rid }}
          path: artifacts/*
          retention-days: 3
          if-no-files-found: error
      - name: Report tested scope
        if: always()
        env:
          TARGET_RID: ${{ matrix.rid }}
          RESULT: ${{ job.status }}
        run: |
          {
            printf '### TourBox shared-core checks: %s\n\n' "$TARGET_RID"
            printf 'Result: **%s**. Commit: `%s`.\n\n' "$RESULT" "$GITHUB_SHA"
            printf '%s\n' 'Builds and executes the shared production OBS/audio/fader logic with controlled test doubles and a local fake OBS transport.'
            printf '\n%s\n' '**Developer executable only.** This is not the Mac TourBox app. Native TourBox input, the setup window, OBS slider movement, permissions and physical hardware are not verified by this job.'
          } >> "$GITHUB_STEP_SUMMARY"
