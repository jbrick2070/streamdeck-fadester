<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fadester for OBS — Fader Dial</title>
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <h3>Fader dial <span class="scope">this action</span></h3>
  <div id="slot-reason-banner" class="status-banner status-err" style="display:none;"></div>

  <div class="row">
    <label for="slot-select">Slot</label>
    <select id="slot-select"></select>
  </div>

  <div class="row">
    <label for="label-input">Label</label>
    <input type="text" id="label-input" maxlength="14" placeholder="From OBS (leave blank)" />
  </div>

  <div class="row">
    <label for="readout-select">Readout</label>
    <select id="readout-select">
      <option value="auto" selected>Engine value (px, dB, %)</option>
      <option value="percent">Always percent</option>
    </select>
  </div>

  <div class="row">
    <label for="step-select">Step per tick</label>
    <select id="step-select">
      <option value="0.005">0.5 % (fine)</option>
      <option value="0.01">1 %</option>
      <option value="0.02" selected>2 % (default)</option>
      <option value="0.05">5 %</option>
      <option value="0.1">10 % (coarse)</option>
    </select>
  </div>

  <div class="row">
    <label for="accel-check">Acceleration</label>
    <input type="checkbox" id="accel-check" checked />
    <span class="hint">Fast turns take bigger steps</span>
  </div>

  <div class="row">
    <label for="press-select">Dial press</label>
    <select id="press-select">
      <option value="snap_0_100" selected>Snap to 0 / 100 %</option>
      <option value="clean_0">Clean (0 %)</option>
      <option value="auto_fade_1s">Auto-fade 1 s</option>
      <option value="auto_fade_2s">Auto-fade 2 s</option>
      <option value="cut">Cut</option>
      <option value="finish_tbar">Finish T-bar</option>
    </select>
  </div>

  <div class="row">
    <label for="long-press-select">Hold (0.8 s)</label>
    <select id="long-press-select">
      <option value="auto_fade_3s" selected>Auto-fade 3 s (with Hold indicator)</option>
      <option value="clean_all_fx">Clean All FX</option>
      <option value="finish_tbar">Finish T-bar</option>
      <option value="none">None</option>
    </select>
  </div>

  <div class="row">
    <label for="thumb-check">Live thumbnails</label>
    <input type="checkbox" id="thumb-check" checked />
    <span class="hint">96×54 in Mix two layers cells (1–2 FPS)</span>
  </div>

  <div id="shared-sections"></div>

  <script src="pi-common.js"></script>
  <script>
    window.onFadesterState = function (state) {
      const longPressEl = document.getElementById("long-press-select");
      if (!longPressEl) return;
      const opt = longPressEl.querySelector('option[value="clean_all_fx"]');
      if (!opt) return;
      const connected = state.status && state.status.kind === "connected";
      const supported = state.capabilities && state.capabilities.resetFx;
      opt.textContent = connected && !supported
        ? "Clean All FX — needs Midi Fadester 0.4.0+"
        : "Clean All FX";
    };

    window.initFadesterPropertyInspector(function (settings, save) {
      const slotEl = document.getElementById("slot-select");
      const labelEl = document.getElementById("label-input");
      const readoutEl = document.getElementById("readout-select");
      const stepEl = document.getElementById("step-select");
      const accelEl = document.getElementById("accel-check");
      const pressEl = document.getElementById("press-select");
      const longPressEl = document.getElementById("long-press-select");
      const thumbEl = document.getElementById("thumb-check");

      if (slotEl && settings.slot) slotEl.value = settings.slot;
      if (labelEl) labelEl.value = settings.labelOverride || "";
      if (readoutEl) readoutEl.value = settings.readoutStyle === "percent" ? "percent" : "auto";
      if (stepEl) stepEl.value = String(settings.stepPerTick || 0.02);
      if (accelEl) accelEl.checked = settings.acceleration !== false;
      if (pressEl) pressEl.value = settings.pressAction || "snap_0_100";
      if (longPressEl) longPressEl.value = settings.longPressAction || "auto_fade_3s";
      if (thumbEl) thumbEl.checked = settings.showThumbnails !== false;

      if (slotEl) slotEl.onchange = () => save({ slot: slotEl.value });
      if (labelEl) labelEl.onchange = () => save({ labelOverride: labelEl.value.trim() });
      if (readoutEl) readoutEl.onchange = () => save({ readoutStyle: readoutEl.value });
      if (stepEl) stepEl.onchange = () => save({ stepPerTick: Number(stepEl.value) });
      if (accelEl) accelEl.onchange = () => save({ acceleration: accelEl.checked });
      if (pressEl) pressEl.onchange = () => save({ pressAction: pressEl.value });
      if (longPressEl) longPressEl.onchange = () => save({ longPressAction: longPressEl.value });
      if (thumbEl) thumbEl.onchange = () => save({ showThumbnails: thumbEl.checked });
    });
  </script>
</body>
</html>
