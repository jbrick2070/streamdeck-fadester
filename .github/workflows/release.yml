name: Release (draft)

# Pushing a version tag such as v0.12.14 builds the release packages from that commit and creates a DRAFT GitHub
# release with them. Nothing is published: a person tests the draft on real hardware, then publishes it.
# The tag must match package.json and the Fadester for OBS manifest. The Companion version comes from
# installer/components.json (companion.version), so the suite setup, the Windows ZIP, the Store package and the
# two Mac app ZIPs (Apple silicon and Intel, built on GitHub's macOS runners) agree.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  streamdeck:
    name: Fadester for OBS package and VJster extension
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Tag must match the plugin version
        run: |
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./io.github.jbrick2070.fadester-for-obs.sdPlugin/manifest.json').Version")
          [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json $pkg"; exit 1; }
          [ "$man" = "$pkg.0" ] || { echo "manifest.json Version $man does not match package.json $pkg"; exit 1; }
      - run: npm ci
      - name: Build, validate and pack
        run: node --import tsx scripts/suite/package-candidate.ts
      - name: Full test suite against the built tree
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-streamdeck
          path: |
            release/candidates/windows-macos/*.streamDeckPlugin
            release/candidates/windows-macos/*.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  # The package above is built on Linux, where every test that loads the packaged native addon (koffi) is skipped.
  # The same commit is built, packed and tested again where the plugin really runs, and the draft waits for both:
  # a package that cannot load on Windows or macOS never reaches a draft release.
  streamdeck-native:
    name: Fadester for OBS package, loaded and tested (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Confirm native host and Node runtime
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
          assert.equal(process.arch, process.env.EXPECTED_ARCH);
          NODE
      - run: npm ci
      - name: Build, validate and pack
        run: node --import tsx scripts/suite/package-candidate.ts
      - name: Full test suite against the built tree (starts the built plugin and loads its native addon)
        run: npm test
      # The tree can hold a file the package lacks: the packed .streamDeckPlugin itself is unpacked and started.
      - name: Unpack the packed plugin and start it as Stream Deck does
        run: |
          set -euo pipefail
          package=release/candidates/windows-macos/io.github.jbrick2070.fadester-for-obs.streamDeckPlugin
          test -f "$package"
          unpacked="$RUNNER_TEMP/fadester-packed"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          unzip -q "$package" -d "$unpacked"
          FADESTER_SMOKE_PLUGIN_DIR="$unpacked/io.github.jbrick2070.fadester-for-obs.sdPlugin" npx vitest run tests/suite-launch-smoke.test.ts

  # The tag names Fadester for OBS's version. Fadester Companion (installer/components.json) and the VJster Chrome
  # extension (vjster-extension/manifest.json) are attached under versions of their own: a release that changed one of
  # them and kept its number would publish two different builds under one version, so the release stops here instead.
  # Each is compared with the release that first carried its present version, over the files that go into it (the
  # Companion's include the VJster OBS page). scripts/release-component-versions.mjs; PUBLISHING.md says what to raise.
  companion-version:
    name: Companion and VJster extension versions moved with their code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A changed component needs a new version of its own
        run: node scripts/release-component-versions.mjs "$GITHUB_SHA"

  companion:
    name: Fadester Companion ZIP and Store package
    needs: [companion-version]
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - name: Build Fadester Companion (self-tests run inside build.ps1)
        shell: pwsh
        run: |
          npm ci
          npm run build:vjster-page
          $v = (Get-Content -Raw installer\components.json | ConvertFrom-Json).components.companion.version
          $out = Join-Path $env:RUNNER_TEMP 'companion'
          & .\tourbox\build.ps1 -OutDir $out -Version $v
          $build = (Get-ChildItem -LiteralPath $out -Directory -Filter 'build-*' | Select-Object -First 1).FullName + '\Fadester Companion'
          & .\tourbox\store\make-msix.ps1 -Build $build -OutDir $out -Version "$v.0" -Overwrite
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -Path (Join-Path $out 'Fadester-Companion-Windows-x64-*.zip') -Destination artifacts
          Copy-Item -Path (Join-Path $out 'FadesterCompanion_*.msix') -Destination artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-companion
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  companion-macos:
    name: Fadester Companion Mac app (${{ matrix.arch }})
    needs: [companion-version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build Fadester Companion.app (self-tests run inside package.sh, on the extracted ZIP)
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          npm ci --no-audit --no-fund
          bash tourbox/macos/package.sh "$RUNNER_TEMP/companion"
          mkdir -p artifacts
          cp "$RUNNER_TEMP"/companion/Fadester-Companion-macOS-*.zip artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-companion-macos-${{ matrix.arch }}
          path: artifacts/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Create the draft release
    needs: [streamdeck, streamdeck-native, companion, companion-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          {
            echo "Draft built from \`$GITHUB_SHA\`. Test on real hardware before publishing."
            echo
            echo "### Which file do I need?"
            echo
            echo "| I have | Download |"
            echo "|---|---|"
            echo "| Windows, and I want everything set up for me | **Fadester Suite Setup** (\`Fadester-Suite-Setup-*.exe\`, added to this release by the Suite Setup workflow) |"
            echo "| A Stream Deck | \`$(ls *.streamDeckPlugin | head -n 1)\`: double-click it, then in OBS tick Tools > WebSocket Server Settings > Enable WebSocket server |"
            echo "| A TourBox, a game controller, or only a keyboard | Fadester Companion (below) |"
            echo "| An APC40 or another MIDI controller | Midi Fadester, from its own releases page: https://github.com/jbrick2070/midi-fadester/releases |"
            echo "| Chrome, to ride a video's speed from the deck | the VJster extension (\`$(ls *.zip | grep -i vjster | head -n 1)\`) |"
            echo
            echo "### Fadester Companion"
            echo
            echo "- Windows: \`$(ls Fadester-Companion-Windows-x64-*.zip)\` (and the Store package \`$(ls FadesterCompanion_*.msix)\`)."
            echo "- Mac, Apple silicon: \`$(ls Fadester-Companion-macOS-arm64-*.zip)\`. Mac, Intel: \`$(ls Fadester-Companion-macOS-x64-*.zip)\`."
            echo "  The Mac app is ad-hoc signed and not notarized. Unzip it and move **Fadester Companion.app** to Applications. macOS refuses to open it the first time: try to open it once, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. (On macOS 14 and older you can instead Control-click the app and choose **Open**, then **Open** again.)"
            echo "  Verified in CI on both architectures: the build and the app's self-tests. Not yet verified on a real Mac: the window on screen, physical TourBox control and the Accessibility prompt. Fadester Companion keeps a typed OBS password in memory only; Keychain saving (the Fadester for OBS plugin on macOS failed with -25293 in testing) is still unverified."
            echo
            echo "### Checksums (SHA-256)"
            for f in *; do echo "    $f: $(sha256sum "$f" | cut -d ' ' -f 1)"; done
          } > ../CHECKSUMS.md
          cat ../CHECKSUMS.md
      - uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: Fadester for OBS ${{ github.ref_name }}
          body_path: CHECKSUMS.md
          files: dist/*
