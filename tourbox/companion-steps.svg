<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Fadester Companion in three steps</title>
  <desc id="d">1: install Fadester Companion and open it. 2: in OBS turn on the WebSocket server; the OBS light in Fadester Companion turns green. 3: put the next scene in Preview, then pull the right trigger or turn the TourBox Dial: OBS's T-bar follows.</desc>
  <style>
    .card { fill: #ffffff; stroke: #cfe0d5; stroke-width: 2; }
    .num { fill: #236044; }
    .numt { fill: #ffffff; font: 700 22px system-ui, "Segoe UI", sans-serif; }
    .h { fill: #162922; font: 700 21px system-ui, "Segoe UI", sans-serif; }
    .s { fill: #3d5a4c; font: 15px system-ui, "Segoe UI", sans-serif; }
    .ink { stroke: #236044; stroke-width: 3; fill: none; }
    .pale { fill: #eef4ef; stroke: #236044; stroke-width: 3; }
    .amber { fill: #e9a84a; }
    .keyt { fill: #236044; font: 700 12px system-ui, "Segoe UI", sans-serif; }
    .arrow { fill: #9bb8a8; }
  </style>
  <rect x="0" y="0" width="900" height="300" rx="18" fill="#eef4ef"/>

  <!-- 1: install and open -->
  <rect class="card" x="20" y="20" width="260" height="260" rx="16"/>
  <circle class="num" cx="52" cy="52" r="18"/><text class="numt" x="52" y="60" text-anchor="middle">1</text>
  <rect class="pale" x="70" y="78" width="160" height="108" rx="10"/>
  <line class="ink" x1="70" y1="100" x2="230" y2="100"/>
  <circle cx="84" cy="89" r="4" fill="#236044"/><circle cx="96" cy="89" r="4" fill="#236044"/><circle cx="108" cy="89" r="4" fill="#236044"/>
  <rect x="86" y="114" width="128" height="14" rx="7" fill="#ffffff" stroke="#236044" stroke-width="2"/>
  <rect x="86" y="136" width="96" height="14" rx="7" fill="#ffffff" stroke="#236044" stroke-width="2"/>
  <rect x="150" y="158" width="64" height="20" rx="10" fill="#236044"/><text x="182" y="172" text-anchor="middle" fill="#ffffff" style="font: 700 12px system-ui, 'Segoe UI', sans-serif">Open</text>
  <text class="h" x="150" y="222" text-anchor="middle">Install and open</text>
  <text class="s" x="150" y="246" text-anchor="middle">Fadester Companion from</text>
  <text class="s" x="150" y="266" text-anchor="middle">the Microsoft Store</text>

  <path class="arrow" d="M288 142 l14 8 -14 8 z"/>

  <!-- 2: OBS link -->
  <rect class="card" x="320" y="20" width="260" height="260" rx="16"/>
  <circle class="num" cx="352" cy="52" r="18"/><text class="numt" x="352" y="60" text-anchor="middle">2</text>
  <rect class="pale" x="370" y="78" width="160" height="108" rx="10"/>
  <rect x="386" y="96" width="22" height="22" rx="4" fill="#236044"/>
  <path d="M391 107 l5 5 9 -10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="416" y="101" width="98" height="12" rx="6" fill="#cfe0d5"/>
  <rect x="386" y="140" width="128" height="32" rx="16" fill="#ffffff" stroke="#236044" stroke-width="2"/>
  <circle cx="404" cy="156" r="8" fill="#5fae7d" stroke="#236044" stroke-width="2"/>
  <text class="keyt" x="420" y="161">OBS</text>
  <text class="h" x="450" y="222" text-anchor="middle">Let it reach OBS</text>
  <text class="s" x="450" y="246" text-anchor="middle">Enable WebSocket server:</text>
  <text class="s" x="450" y="266" text-anchor="middle">the OBS light turns green</text>

  <path class="arrow" d="M588 142 l14 8 -14 8 z"/>

  <!-- 3: throw -->
  <rect class="card" x="620" y="20" width="260" height="260" rx="16"/>
  <circle class="num" cx="652" cy="52" r="18"/><text class="numt" x="652" y="60" text-anchor="middle">3</text>
  <!-- T-bar -->
  <rect x="690" y="78" width="12" height="108" rx="6" fill="#cfe0d5"/>
  <rect x="690" y="132" width="12" height="54" rx="6" fill="#236044"/>
  <rect x="676" y="124" width="40" height="16" rx="5" class="amber" stroke="#236044" stroke-width="2"/>
  <path class="ink" d="M726 160 v-40" marker-end="url(#tip)"/>
  <!-- trigger -->
  <path d="M760 96 q22 -14 44 0 v28 q-22 10 -44 0 z" class="amber" stroke="#236044" stroke-width="3"/>
  <text class="keyt" x="782" y="117" text-anchor="middle">RT</text>
  <!-- dial -->
  <circle cx="830" cy="158" r="26" class="pale"/><circle cx="830" cy="158" r="15" fill="#ffffff" stroke="#236044" stroke-width="2"/>
  <line x1="830" y1="158" x2="840" y2="148" stroke="#236044" stroke-width="4" stroke-linecap="round"/>
  <text class="s" x="790" y="164" text-anchor="middle">or</text>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#236044"/></marker></defs>
  <text class="h" x="750" y="222" text-anchor="middle">Pull or turn</text>
  <text class="s" x="750" y="246" text-anchor="middle">Trigger or TourBox Dial:</text>
  <text class="s" x="750" y="266" text-anchor="middle">OBS's T-bar follows</text>
</svg>
